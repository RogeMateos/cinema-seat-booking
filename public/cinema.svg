<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#1a1a2e"/>

  <!-- Film reel circles -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d4af37" stroke-width="8"/>

  <!-- Film reel holes (left) -->
  <circle cx="60" cy="70" r="8" fill="#d4af37"/>
  <circle cx="60" cy="100" r="8" fill="#d4af37"/>
  <circle cx="60" cy="130" r="8" fill="#d4af37"/>

  <!-- Film reel holes (right) -->
  <circle cx="140" cy="70" r="8" fill="#d4af37"/>
  <circle cx="140" cy="100" r="8" fill="#d4af37"/>
  <circle cx="140" cy="130" r="8" fill="#d4af37"/>

  <!-- Film strip center -->
  <rect x="75" y="85" width="50" height="30" rx="3" fill="#d4af37"/>

  <!-- Film strip sprocket holes -->
  <rect x="78" y="88" width="4" height="4" fill="#1a1a2e"/>
  <rect x="85" y="88" width="4" height="4" fill="#1a1a2e"/>
  <rect x="92" y="88" width="4" height="4" fill="#1a1a2e"/>
  <rect x="99" y="88" width="4" height="4" fill="#1a1a2e"/>
  <rect x="106" y="88" width="4" height="4" fill="#1a1a2e"/>
  <rect x="113" y="88" width="4" height="4" fill="#1a1a2e"/>

  <rect x="78" y="108" width="4" height="4" fill="#1a1a2e"/>
  <rect x="85" y="108" width="4" height="4" fill="#1a1a2e"/>
  <rect x="92" y="108" width="4" height="4" fill="#1a1a2e"/>
  <rect x="99" y="108" width="4" height="4" fill="#1a1a2e"/>
  <rect x="106" y="108" width="4" height="4" fill="#1a1a2e"/>
  <rect x="113" y="108" width="4" height="4" fill="#1a1a2e"/>
</svg>
